spring:
  application:
    name: vault
  datasource:
    username: engine_user
    password: iknow24
    url: jdbc:postgresql://192.168.1.13:5432/vault
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  properties:
    hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/api/.well-known/jwks.json
          audiences:
            - vault
          issuer-uri: http://localhost:8088
minio:
  url: http://192.168.1.13:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: iflow
  deploy-bucket: iflow-deploy
  svg-bucket: iflow-svg
  
eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8081/eureka"
    initial-instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
iflow:
  envoy:
    client-secret:
server:
  port: 0
