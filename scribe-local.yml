  spring:
    security:
      oauth2:
        resourceserver:
          jwt:
            jwk-set-uri: http://localhost:8088/api/.well-known/jwks.json
            issuer-uri: http://localhost:8088
    datasource:                                                                                                                                          
      url: jdbc:postgresql://192.168.1.13:5432/scribe
      username: engine_user
      password: iknow24
      driver-class-name: org.postgresql.Driver                                                                                                     
      hikari:                                                                                                           
        pool-name: cairn-pool
        maximum-pool-size: ${DB_POOL_SIZE:5}
        minimum-idle: 1
    jpa:                                                                                                                                          
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true
      locations: classpath:db/migration
      table: flyway_schema_history_cairn
      baseline-on-migrate: true
      baseline-version: 0
  eureka:
    client:
      register-with-eureka: true
      service-url:
        defaultZone: "http://localhost:8081/eureka"
      initial-instance-info-replication-interval-seconds: 5
      registry-fetch-interval-seconds: 5
    instance:
      prefer-ip-address: true
